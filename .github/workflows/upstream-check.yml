name: Check upstream updates
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check upstream commits
        run: |
          git remote add upstream https://github.com/iib0011/omni-tools.git
          git fetch upstream main
          COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "New upstream commits: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::notice::Upstream has $COUNT commits to review and merge."
          fi
