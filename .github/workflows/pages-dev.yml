name: GitHub Pages Dev

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-dev-${{ github.event_name == 'pull_request' && github.event.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/check-text-style.mjs
      - run: npm ci
      - run: npm run test -- --run
      - run: node --test scripts/pages/prepare.test.mjs
      - name: Verify production build without deploying
        run: npm run build
      - run: node scripts/validate-list-worker.mjs
      - name: Install focused browser
        run: npx playwright install --with-deps chromium
      # Worker deadlines include startup; isolate ReDoS cases from other worker startups.
      - name: Verify SEO, local demos, image downloads and bounded list processing
        run: npx playwright test src/features/tool-discovery/discovery.e2e.spec.ts src/security/security.e2e.spec.ts src/seo/seo.e2e.spec.ts src/ai/json-assistant/json-assistant.e2e.spec.ts src/ai/regex-assistant/regex-assistant.e2e.spec.ts src/pages/tools/image/png/convert-jgp-to-png/convert-jgp-to-png.e2e.spec.ts src/workers/list-regex/list-regex.e2e.spec.ts src/features/web-conversion/html-to-image.e2e.spec.ts src/features/web-conversion/html-pdf.e2e.spec.ts src/features/web-conversion/pagination.e2e.spec.ts src/features/web-conversion/page-ranges.e2e.spec.ts src/features/web-conversion/table-headers.e2e.spec.ts src/features/web-conversion/presets.e2e.spec.ts src/features/web-conversion/deadline.e2e.spec.ts src/features/web-conversion/pdf-baseline/pdf-baseline.e2e.spec.ts --project=chromium --workers=1
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: 'true'
      - name: Build development site
        run: node scripts/pages/build.mjs
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: pages-dist

  deploy:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy development site
        id: deployment
        uses: actions/deploy-pages@v4
