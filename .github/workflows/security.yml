name: Security

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: '31 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Verify scanner clean and synthetic-leak controls
        shell: bash
        run: |
          set -euo pipefail
          control_dir="$(mktemp -d)"
          trap 'rm -rf -- "$control_dir"' EXIT
          mkdir "$control_dir/clean" "$control_dir/leak"
          printf 'No credentials in this fixture.\n' > "$control_dir/clean/readme.txt"
          printf 'token=gh%s_%s\n' p A9b8C7d6E5f4G3h2I1j0K9l8M7n6O5p4Q3r2 > "$control_dir/leak/credential.txt"
          gitleaks dir --redact=100 --no-banner --log-level=warn "$control_dir/clean"
          status=0
          gitleaks dir --redact=100 --no-banner --log-level=warn "$control_dir/leak" || status=$?
          test "$status" -eq 1
      - name: Scan fetched history and checkout without exposing matches
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact=100 --no-banner --log-level=warn --log-opts="--all" .
          gitleaks dir --redact=100 --no-banner --log-level=warn .

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      # The gate is plain Node and audits the lockfile. No install hooks or build.
      - run: npm run security:test
      - run: npm run security:check

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: '/language:javascript-typescript'
          output: codeql-results
          # Fork PRs can be analyzed without requiring write credentials.
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Summarize CodeQL metadata without source snippets
        run: node scripts/security/summarize-codeql.mjs codeql-results
