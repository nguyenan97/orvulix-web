[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "20"

# ORVULIX-SEO: no SPA fallback. Every valid route is a static HTML file
# generated by scripts/seo/prerender.mjs; unknown paths get dist/404.html with
# HTTP 404. See docs/SEO.md before adding a catch-all rewrite.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# ORVULIX-SEO: cache policy (docs/SEO.md). HTML, sitemap and other files keep
# Netlify's default `public, max-age=0, must-revalidate`. Only Vite's
# content-hashed output is immutable; public/assets (fonts, backgrounds) keeps
# stable names and is never matched (checked by scripts/seo/validate-dist.mjs).
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Translations change without a new file name; let browsers reuse them briefly.
[[headers]]
  for = "/locales/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
