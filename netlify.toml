[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "20"

# ORVULIX-SEO: no SPA fallback. Every valid route is a static HTML file
# generated by scripts/seo/prerender.mjs; unknown paths get dist/404.html with
# HTTP 404. See docs/SEO.md before adding a catch-all rewrite.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
